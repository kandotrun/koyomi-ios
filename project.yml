name: Koyomi

options:
  bundleIdPrefix: run.kan
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SUPPORTS_MACCATALYST: false
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: UGNVGWZMAU
    CURRENT_PROJECT_VERSION: "2"
    MARKETING_VERSION: "2.0.0"

configs:
  Debug: debug
  Release: release

targets:
  Koyomi:
    type: application
    platform: iOS
    sources:
      - path: Koyomi
      - path: Shared
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
        type: file
    resources:
      - path: Koyomi/Assets.xcassets
    dependencies:
      - target: KoyomiWidget
        embed: true
    info:
      path: Koyomi/Info.plist
      properties:
        CFBundleDisplayName: こよみ
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsFullAccessUsageDescription: 予定とタスクの表示・作成・編集・完了・削除、ピン留めのためにカレンダーを使用します。内容は端末の外へ送信しません。
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: run.kan.koyomi
            CFBundleURLSchemes:
              - koyomi
    entitlements:
      path: Koyomi/Koyomi.entitlements
      properties:
        keychain-access-groups:
          - "$(AppIdentifierPrefix)run.kan.koyomi.shared"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.kan.koyomi
        PRODUCT_NAME: Koyomi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"

  KoyomiWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: KoyomiWidget
      - path: Shared
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
        type: file
    info:
      path: KoyomiWidget/Info.plist
      properties:
        CFBundleDisplayName: こよみ
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: KoyomiWidget/KoyomiWidget.entitlements
      properties:
        keychain-access-groups:
          - "$(AppIdentifierPrefix)run.kan.koyomi.shared"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.kan.koyomi.widget
        PRODUCT_NAME: KoyomiWidget
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
        TARGETED_DEVICE_FAMILY: "1"

  KoyomiAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KoyomiAppTests
    dependencies:
      - target: Koyomi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.kan.koyomi.tests
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1"

  KoyomiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KoyomiUITests
    dependencies:
      - target: Koyomi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.kan.koyomi.uitests
        TEST_TARGET_NAME: Koyomi
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Koyomi:
    build:
      targets:
        Koyomi: all
        KoyomiWidget: all
        KoyomiUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: KoyomiAppTests
          parallelizable: true
        - name: KoyomiUITests
          parallelizable: false
    run:
      config: Debug
    archive:
      config: Release
